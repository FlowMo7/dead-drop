variables:
  PRIVATE_REGISTRY: registry.moetz.dev/dead-drop
  PUBLIC_REGISTRY: flowmo7/dead-drop

stages:
  - build_application
  - build_image
  - tag_image


build application:
  stage: build_application
  script:
    - ./gradlew clean build test distZip
  artifacts:
    paths:
      - build/distributions/dead-drop.zip
  tags:
    - docker
  image: maven:3.9.10-eclipse-temurin-21

build and push private registry:
  stage: build_image
  script:
    - docker build --pull -t $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG ./
    - docker login -u $REGISTRY_MOETZ_DEV_USERNAME -p $REGISTRY_MOETZ_DEV_PASSWORD registry.moetz.dev
    - docker push $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG
  tags:
    - docker
  except:
    - tags

build and push docker hub:
  stage: tag_image
  script:
    - docker login -u $REGISTRY_MOETZ_DEV_USERNAME -p $REGISTRY_MOETZ_DEV_PASSWORD registry.moetz.dev
    - docker pull $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG
    - docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PUBLIC_REGISTRY:$CI_COMMIT_REF_SLUG
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
    - docker push $PUBLIC_REGISTRY:$CI_COMMIT_REF_SLUG
  tags:
    - docker
  only:
    - develop
    - master
    - tags
  except:
    - tags

publish versioned image:
  stage: tag_image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      VERSION=$CI_COMMIT_TAG
      MAJOR=${VERSION%%.*}
      MAJOR_MINOR=${VERSION%.*}

      docker login -u $REGISTRY_MOETZ_DEV_USERNAME -p $REGISTRY_MOETZ_DEV_PASSWORD registry.moetz.dev
      docker pull $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG

      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PRIVATE_REGISTRY:$VERSION
      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PRIVATE_REGISTRY:$MAJOR
      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PRIVATE_REGISTRY:$MAJOR_MINOR
      
      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PUBLIC_REGISTRY:$VERSION
      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PUBLIC_REGISTRY:$MAJOR
      docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PUBLIC_REGISTRY:$MAJOR_MINOR

      docker login -u $REGISTRY_MOETZ_DEV_USERNAME -p $REGISTRY_MOETZ_DEV_PASSWORD registry.moetz.dev
      docker push "$PRIVATE_REGISTRY:$VERSION"
      docker push "$PRIVATE_REGISTRY:$MAJOR"
      docker push "$PRIVATE_REGISTRY:$MAJOR_MINOR"

      docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
      docker push "$PUBLIC_REGISTRY:$VERSION"
      docker push "$PUBLIC_REGISTRY:$MAJOR"
      docker push "$PUBLIC_REGISTRY:$MAJOR_MINOR"
  tags:
    - docker

tag latest private registry:
  stage: tag_image
  script:
    - docker login -u $REGISTRY_MOETZ_DEV_USERNAME -p $REGISTRY_MOETZ_DEV_PASSWORD registry.moetz.dev
    - docker pull $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG
    - docker tag $PRIVATE_REGISTRY:$CI_COMMIT_REF_SLUG $PRIVATE_REGISTRY:latest
    - docker push $PRIVATE_REGISTRY:latest
  tags:
    - docker
  only:
    - master

tag latest docker hub:
  stage: tag_image
  script:
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
    - docker pull $PUBLIC_REGISTRY:$CI_COMMIT_REF_SLUG
    - docker tag $PUBLIC_REGISTRY:$CI_COMMIT_REF_SLUG $PUBLIC_REGISTRY:latest
    - docker push $PUBLIC_REGISTRY:latest
  tags:
    - docker
  only:
    - master
