plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

group "dev.moetz.deaddrop"
version "0.0.1"

application {
    mainClass = 'dev.moetz.deaddrop.ApplicationKt'
}

distributions {
    main {
        distributionBaseName = 'dead-drop'
    }
}

tasks.distZip {
    archiveFileName = 'dead-drop.zip'
}

kotlin {
    jvmToolchain(21)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation Ktor.server.core
    implementation Ktor.server.netty
    implementation Ktor.server.htmlBuilder
    implementation KotlinX.serialization.json
    implementation Ktor.server.defaultHeaders
    implementation Ktor.server.autoHeadResponse
    implementation Ktor.server.cachingHeaders
    implementation Ktor.server.forwardedHeader
    implementation Ktor.server.conditionalHeaders
    implementation Ktor.server.compression

    implementation "ch.qos.logback:logback-classic:_"

    testImplementation Ktor.server.testHost
    testImplementation Kotlin.test
    testImplementation Testing.mockK
}

jar {
    manifest {
        attributes['Main-Class'] = 'dev.moetz.deaddrop.ApplicationKt'
        attributes['Implementation-Title'] = "DeadDrop"
        attributes['Implementation-Version'] = archiveVersion
    }
}
